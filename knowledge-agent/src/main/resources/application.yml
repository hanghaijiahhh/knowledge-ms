server:
  port: 8087

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS}

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 0.3
    max-tokens: 2048

agent:
  max-turns: 3
  max-context-chars: 8000
  session-ttl-minutes: 30
